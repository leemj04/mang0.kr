<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Review | Minjae Lee</title>
  <meta name="description" content="Markdown review viewer" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="stylesheet" href="/css/review.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/copy-tex.min.css" />
</head>

<body data-page="review">
  <header class="site-header">
    <div class="container">
      <div class="top">
        <div class="title">
          <a class="name" href="/index.html">mang0.kr</a>
        </div>
        <nav class="nav" aria-label="Primary">
          <a href="/pages/list.html">Blog</a>
          <a href="/index.html">CV</a>
        </nav>
      </div>
    </div>
  </header>

  <main class="container review-layout">
    <aside class="review-list" aria-label="Review files">
      <div class="review-title-row">
        <h1 class="review-title">Reviews</h1>
        <div class="lang-toggle" role="group" aria-label="Language">
          <button type="button" class="lang-btn" data-lang="ko">KR</button>
          <button type="button" class="lang-btn" data-lang="en">EN</button>
        </div>
      </div>
      <div class="filter-toggle" role="group" aria-label="Content type">
        <button type="button" class="filter-btn" data-filter="all">All</button>
        <button type="button" class="filter-btn" data-filter="review">Paper</button>
        <button type="button" class="filter-btn" data-filter="writeup">Writeup</button>
      </div>
      <div id="fileList" class="file-list"></div>
    </aside>

    <section class="review-content" aria-live="polite">
      <div id="status" class="status muted"></div>
      <article id="content" class="md-content"></article>
    </section>
  </main>

  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/copy-tex.min.js"></script>
  <script defer src="/js/render.js"></script>
</body>
</html>
